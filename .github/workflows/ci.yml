name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # opencv-python links against these; the headless runners do not have them.
      - name: Install OpenCV runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[test]"

      - name: Test
        run: pytest -q

      # Proves the whole pipeline runs end to end with no DAC and no camera.
      - name: Smoke test (simulator)
        run: >
          python -m webcam_ilda --dry-run --headless --ack-safety
          --source synthetic --frames 5 --log-level WARNING
